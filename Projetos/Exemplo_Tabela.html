<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de tabela</title>
    <style>
        table, th, td{
            border: 1px solid black;
            color: rgb(0, 0, 0); 
            background-color: aqua;
        };
    </style>
</head>
<body>
    <h1>Exemplo de tabela basico.</h1>
    <table style="width: 50%;">
        <tr>
            <td>Empresa</td>
            <td>Contato</td>
            <td>País</td>
        </tr>
        <tr>
            <td>Global do Brasil</td>
            <td>Rafael</td>
            <td>Brasil</td>
        </tr>
    </table>

    <table style="width: 70%;">
        <tr>
            <td>Empresa</td>
            <td>Contato</td>
            <td>País</td>
        </tr>
        <tr>
            <td>Global do Brasil</td>
            <td>Rafael</td>
            <td>Brasil</td>
        </tr>
    </table>

    <table style="width: 100%;">
        <tr>
            <td>Empresa</td>
            <td>Contato</td>
            <td>País</td>
        </tr>
        <tr>
            <td>Global do Brasil</td>
            <td>Rafael</td>
            <td>Brasil</td>
        </tr>
    </table>
</body>
</html>
